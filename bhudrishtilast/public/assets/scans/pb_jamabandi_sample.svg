<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" style="background:#f5efe3; font-family:'Plus Jakarta Sans', sans-serif;">
  <rect width="800" height="1100" fill="#f5eee2" />
  <rect x="25" y="25" width="750" height="1050" fill="#fdfbf7" stroke="#4e342e" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <text y="20" font-size="18" font-weight="bold" fill="#1b120c">Government of Punjab — Department of Revenue</text>
    <text y="44" font-size="15" font-weight="bold" fill="#3e2723">ਜਮ੍ਹਾਂਬੰਦੀ ਰਜਿਸਟਰ (ਅਧਿਕਾਰ ਰਿਕਾਰਡ - RoR)</text>
    <text y="66" font-size="12" fill="#5d4037">ਪਿੰਡ: ਅਲਹੋਰਾ (Alhoran) • ਤਹਿਸੀਲ: ਨਾਭਾ • ਜ਼ਿਲ੍ਹਾ: ਪਟਿਆਲਾ (LGD: 389201)</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(50, 170)">
    <rect width="700" height="40" fill="#e5dac7" stroke="#4e342e" stroke-width="1.5" />
    <line x1="130" y1="0" x2="130" y2="40" stroke="#4e342e" />
    <line x1="250" y1="0" x2="250" y2="40" stroke="#4e342e" />
    <line x1="490" y1="0" x2="490" y2="40" stroke="#4e342e" />
    <line x1="600" y1="0" x2="600" y2="40" stroke="#4e342e" />

    <text x="65" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b120c">ਖੇਵਟ/ਖਤੌਨੀ</text>
    <text x="190" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b120c">ਮੁਰੱਬਾ / ਕਿੱਲਾ</text>
    <text x="370" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b120c">ਮਾਲਕ ਦਾ ਨਾਮ, ਵਲਦੀਅਤ ਤੇ ਹਿੱਸਾ</text>
    <text x="545" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b120c">ਰਕਬਾ (ਹੈਕ.)</text>
    <text x="650" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b120c">ਇੰਤਕਾਲ / ਕੈਫੀਅਤ</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(50, 210)">
    <rect width="700" height="340" fill="#ffffff" stroke="#4e342e" stroke-width="1.5" />
    <line x1="130" y1="0" x2="130" y2="340" stroke="#4e342e" />
    <line x1="250" y1="0" x2="250" y2="340" stroke="#4e342e" />
    <line x1="490" y1="0" x2="490" y2="340" stroke="#4e342e" />
    <line x1="600" y1="0" x2="600" y2="340" stroke="#4e342e" />

    <text x="65" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b120c">੫੬/੧੧੨</text>
    <text x="65" y="70" text-anchor="middle" font-size="11" fill="#5d4037">(56/112)</text>

    <text x="190" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b120c">੩੪//੧੨</text>
    <text x="190" y="70" text-anchor="middle" font-size="11" fill="#5d4037">ਮਿਨ (34//12)</text>

    <!-- Owners -->
    <g transform="translate(265, 30)">
      <text y="15" font-size="13" font-weight="bold" fill="#1b120c">੧. ਗੁਰਦੀਪ ਸਿੰਘ ਪੁੱਤਰ ਹਰਭਜਨ ਸਿੰਘ</text>
      <text x="15" y="32" font-size="11" fill="#5d4037">ਹਿੱਸਾ: ੧/੨ (੫੦%) - Gurdeep Singh</text>

      <text y="70" font-size="13" font-weight="bold" fill="#1b120c">੨. ਬਲਵਿੰਦਰ ਕੌਰ ਪਤਨੀ ਗੁਰਦੀਪ ਸਿੰਘ</text>
      <text x="15" y="87" font-size="11" fill="#5d4037">ਹਿੱਸਾ: ੧/੨ (੫੦%) - Balwinder Kaur</text>

      <line x1="0" y1="105" x2="210" y2="105" stroke="#d5c7a9" />
      <text y="125" font-size="11" font-weight="bold" fill="#2e7d32">ਕੁੱਲ ਹਿੱਸਾ: ੧੦੦% (ਸੰਤੁਲਿਤ)</text>
    </g>

    <!-- Area -->
    <text x="545" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">੧.੮੨ ਹੈਕ.</text>
    <text x="545" y="70" text-anchor="middle" font-size="11" fill="#5d4037">(1.82 Ha)</text>
    <text x="545" y="90" text-anchor="middle" font-size="10" fill="#795548">੪ ਕਿੱਲੇ ੨ ਕਨਾਲ</text>

    <!-- Mutation -->
    <g transform="translate(610, 30)" font-size="10" fill="#3e2723">
      <text y="15" font-weight="bold">ਇੰਤਕਾਲ ਨੰ. ੮੯੨</text>
      <text y="30">ਮਿਤੀ ੧੯/੦੮/੨੦੨੧</text>
      <text y="45">ਬੈਨਾਮਾ ਰਜਿਸਟਰੀ</text>
      <text y="60">ਤਸਦੀਕ ਤਹਿਸੀਲਦਾਰ</text>
      <text y="75" fill="#2e7d32">ਕੋਈ ਬਕਾਇਆ ਨਹੀਂ</text>
    </g>
  </g>
</svg>
