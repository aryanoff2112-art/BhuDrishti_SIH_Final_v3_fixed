    <line x1="150" y1="0" x2="150" y2="340" stroke="#000000" stroke-width="2" />
    <line x1="320" y1="0" x2="320" y2="340" stroke="#000000" stroke-width="2" />
    <line x1="520" y1="0" x2="520" y2="340" stroke="#000000" stroke-width="2" />

    <text x="75" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">१०८</text>
    <text x="75" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">हिस्सा: अ</text>

    <text x="235" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">२.१५ हे. आर</text>
    <text x="235" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">जिरायत/बागायत</text>

    <g transform="translate(335, 30)">
