<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%" style="background:#ffffff; font-family:'Noto Sans Devanagari', sans-serif;">
  <rect width="800" height="1100" fill="#ffffff" />
  <rect x="25" y="25" width="750" height="1050" fill="#ffffff" stroke="#000000" stroke-width="2" />

  <g transform="translate(540, 45)">
    <rect width="220" height="26" fill="#000000" rx="3" />
    <text x="110" y="17" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="1">CV: SAUVOLA LOCAL (96% Q)</text>
  </g>

  <g transform="translate(400, 95)" text-anchor="middle">
