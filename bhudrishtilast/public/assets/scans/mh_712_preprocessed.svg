    <text y="44" font-size="15" font-weight="bold" fill="#000000">गाव नमुना सात (अधिकार अभिलेख पत्रक) व बारा (पिकांची नोंदवही)</text>
    <text y="66" font-size="12" font-weight="bold" fill="#000000">गाव: मौजे बारामती • तालुका: बारामती • जिल्हा: पुणे (LGD: 556120)</text>
  </g>

  <g transform="translate(50, 170)">
    <rect width="700" height="40" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <line x1="150" y1="0" x2="150" y2="40" stroke="#000000" stroke-width="2" />
    <line x1="320" y1="0" x2="320" y2="40" stroke="#000000" stroke-width="2" />
    <line x1="520" y1="0" x2="520" y2="40" stroke="#000000" stroke-width="2" />

    <text x="75" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">गट / सर्व्हे क्र.</text>
    <text x="235" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">क्षेत्र (हे. आर)</text>
    <text x="420" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">खातेदार व इतर हक्क</text>
    <text x="610" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">फेरफार व बोजा</text>
  </g>

  <g transform="translate(50, 210)">
